name: Validate application code

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install generator dependency
        run: python -m pip install -r requirements.txt
      - name: Validate schedule generator and KV publisher
        run: python -m unittest discover -s tests -v
      - name: Validate Worker and browser JavaScript
        run: node --test tests/test_worker.mjs tests/test_theme.mjs && node --check site/app.js && node --check site/theme.mjs && node --check worker/index.mjs
